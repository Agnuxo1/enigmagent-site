<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="EnigmAgent open-source project portal.">
    <meta name="robots" content="index, follow">
    <meta http-equiv="refresh" content="0; url=https://agnuxo1.github.io/EnigmAgent/">
    <link rel="canonical" href="https://agnuxo1.github.io/EnigmAgent/">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <title>EnigmAgent — Open-source project portal</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; background: #0f172a; color: #f8fafc; }
      main { width: min(100%, 42rem); padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid #334155; border-radius: 1.25rem; background: #111827; box-shadow: 0 1.5rem 4rem #02061780; }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 4rem); line-height: 1; letter-spacing: -0.04em; }
      p { color: #cbd5e1; font-size: 1.05rem; line-height: 1.65; }
      a { color: #c4b5fd; font-weight: 700; }
      a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 0.25rem; }
      .status { margin-top: 1.5rem; padding: 1rem; border-left: 0.25rem solid #a855f7; background: #1e293b; }
      .status p { margin: 0; }
      footer { margin-top: 2rem; color: #94a3b8; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">EnigmAgent</h1>
      <p>Open-source tools for privacy-conscious AI workflows.</p>
      <div class="status" role="status" aria-live="polite">
        <p>Redirecting to the project portal. If you are not redirected, <a href="https://agnuxo1.github.io/EnigmAgent/">open EnigmAgent manually</a>.</p>
      </div>
      <footer>This small site is a maintained entry point; the main project contains the current documentation and source.</footer>
    </main>
  </body>
</html>
